<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- цвет строки состояния в установленном приложении -->
  <meta name="theme-color" content="#ffffff">
  <title>Kaspi.kz</title>

  <!-- иконка приложения: свой логотип кладите в assets/icons/app-192.png и app-512.png -->
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/app-192.png">
  <link rel="apple-touch-icon" href="assets/icons/app-192.png">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Kaspi.kz">

  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <div id="root">
    <div class="container">

      <!-- шапка -->
      <div>
        <div class="title">
          <button type="button" class="back-btn" id="btnBack" aria-label="Назад">
            <svg class="back-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M19.2 12H5.4m0 0 6.1-6.1M5.4 12l6.1 6.1" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <h1 class="text-title">Удостоверение личности</h1>
        </div>
        <div class="tab">
          <div class="btntab">
            <input type="radio" name="tab-btn" id="tab-btn-1" value="doc" checked>
            <label for="tab-btn-1"><p>Документ</p></label>
            <input type="radio" name="tab-btn" id="tab-btn-2" value="req">
            <label for="tab-btn-2"><p>Реквизиты</p></label>
          </div>
        </div>
      </div>

      <!-- середина -->
      <div class="middle">

        <!-- вкладка «Документ» -->
        <div id="doc-panel">
          <div class="img-upload" id="imgUpload">
            <div class="input-img">
              <input type="file" name="img-upl" id="idupload" class="input-file"
                     accept="application/pdf,image/*">
              <label for="idupload"><span>Загрузить</span></label>
            </div>
          </div>

          <div id="document" hidden>
            <img id="docImage" src="" alt="Документ">
          </div>

          <div class="doc-loader" id="docLoader" hidden><span class="spin"></span></div>
        </div>

        <!-- вкладка «Реквизиты» -->
        <div id="req" hidden>
          <ul class="rekvizit">
            <li>
              <span class="atritem">ФИО</span><br>
              <input id="f-fio" class="rekitem" type="text" maxlength="28" spellcheck="false">
              <img src="assets/icons/copy.png" alt="" data-copy="f-fio">
            </li>
            <li>
              <span class="atritem">ИИН</span><br>
              <input id="f-iin" class="rekitem" type="text" maxlength="12">
              <img src="assets/icons/copy.png" alt="" data-copy="f-iin">
            </li>
            <li>
              <span class="atritem">Дата рождения</span><br>
              <input id="f-birth" class="rekitem" type="text" maxlength="10">
              <img src="assets/icons/copy.png" alt="" data-copy="f-birth">
            </li>
            <li>
              <span class="atritem">Номер документа</span><br>
              <input id="f-docnum" class="rekitem" type="text" maxlength="9">
              <img src="assets/icons/copy.png" alt="" data-copy="f-docnum">
            </li>
            <li>
              <span class="atritem">Дата выдачи</span><br>
              <input id="f-viddata" class="rekitem" type="text" maxlength="10">
              <img src="assets/icons/copy.png" alt="" data-copy="f-viddata">
            </li>
            <li>
              <span class="atritem">Срок действия</span><br>
              <input id="f-expdata" class="rekitem" type="text" maxlength="10">
              <img src="assets/icons/copy.png" alt="" data-copy="f-expdata">
            </li>
            <li id="saveRow" hidden>
              <button type="button" class="save-button" id="btnSave">Сохранить</button>
            </li>
          </ul>
        </div>
      </div>

      <!-- футер -->
      <div class="footer">
        <div class="btnfooter" id="docbtn">
          <button type="button" id="btnftr1">
            <img src="assets/icons/qr.png" alt="">Предъявить документ
          </button>
          <button type="button" id="btnftr2" class="share">
            <svg class="btn-ico" viewBox="0 0 512 512" aria-hidden="true">
              <path d="M512 447.994V241.34C512 206.09 473.641 177.334 426.621 177.334H371.351C362.002 177.334 354.44 183.003 354.44 190.011C354.44 197.02 356.365 209.505 365.714 209.505H429.714C458.174 209.505 475.429 228.503 475.429 249.838L475.429 448.2C475.429 469.535 455.081 486.954 426.621 486.954H85.3792C56.9194 486.954 36.5714 472.836 36.5714 451.501V239.755C36.5714 218.419 56.9194 209.505 85.3792 209.505H146.286C155.635 209.505 157.56 196.917 157.56 189.908C157.56 182.9 149.998 177.231 140.649 177.231H85.3792C38.3587 177.231 0 205.987 0 241.237V447.994C0 483.244 38.3587 512 85.3792 512H426.621C473.779 512 512 483.347 512 447.994Z" fill="currentColor"/>
              <path d="M119.028 121.874C126.136 127.47 137.538 127.47 144.645 121.874L237.934 48.4349V316.313C237.934 324.24 246.079 330.652 256.148 330.652C266.217 330.652 274.361 324.24 274.361 316.313V48.5515L367.65 121.991C371.204 124.788 375.795 126.187 380.533 126.187C385.272 126.187 389.862 124.788 393.416 121.991C400.524 116.395 400.524 107.42 393.416 101.824L269.179 4.02167C262.367 -1.34056 250.373 -1.34056 243.561 4.02167L119.324 101.824C111.92 107.303 111.92 116.279 119.028 121.874Z" fill="currentColor"/>
            </svg>Отправить документ
          </button>
        </div>
        <div class="btnfooter" id="reqbtn" hidden>
          <button type="button" id="btnftr3" class="share">
            <svg class="btn-ico" viewBox="0 0 512 512" aria-hidden="true">
              <path d="M512 447.994V241.34C512 206.09 473.641 177.334 426.621 177.334H371.351C362.002 177.334 354.44 183.003 354.44 190.011C354.44 197.02 356.365 209.505 365.714 209.505H429.714C458.174 209.505 475.429 228.503 475.429 249.838L475.429 448.2C475.429 469.535 455.081 486.954 426.621 486.954H85.3792C56.9194 486.954 36.5714 472.836 36.5714 451.501V239.755C36.5714 218.419 56.9194 209.505 85.3792 209.505H146.286C155.635 209.505 157.56 196.917 157.56 189.908C157.56 182.9 149.998 177.231 140.649 177.231H85.3792C38.3587 177.231 0 205.987 0 241.237V447.994C0 483.244 38.3587 512 85.3792 512H426.621C473.779 512 512 483.347 512 447.994Z" fill="currentColor"/>
              <path d="M119.028 121.874C126.136 127.47 137.538 127.47 144.645 121.874L237.934 48.4349V316.313C237.934 324.24 246.079 330.652 256.148 330.652C266.217 330.652 274.361 324.24 274.361 316.313V48.5515L367.65 121.991C371.204 124.788 375.795 126.187 380.533 126.187C385.272 126.187 389.862 124.788 393.416 121.991C400.524 116.395 400.524 107.42 393.416 101.824L269.179 4.02167C262.367 -1.34056 250.373 -1.34056 243.561 4.02167L119.324 101.824C111.92 107.303 111.92 116.279 119.028 121.874Z" fill="currentColor"/>
            </svg>Отправить реквизиты
          </button>
        </div>
      </div>

    </div>
  </div>

  <!-- всплывающее окно предъявления -->
  <div class="popup-overlay" id="popup" hidden>
    <div class="popup-content" id="popupContent">
      <p class="popup-title">Удостоверение личности</p>
      <p class="popup-description">Покажите QR-код сотруднику</p>
      <div class="qr-code-container" id="qrBox">
        <canvas id="qrCanvas" width="200" height="200"></canvas>
      </div>
      <p class="popup-text">или скажите код</p>
      <p class="popup-num" id="popupNum">000000</p>
      <button type="button" class="close-btn" id="popupClose" aria-label="Закрыть">x</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
